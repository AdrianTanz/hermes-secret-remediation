name: secret-remediation
repo: https://github.com/AdrianTanz/hermes-secret-remediation
# Pinned to the GitHub merge commit that carries the plugin tree and the
# chosen LICENSE wording (Copyright (c) 2026 AdrianTanz).
sha: "4b28bcef771009351e904afc2a0f2196b89c87ff"
description: Fingerprint leaked credentials in the Hermes workspace, logs, and session history. Redacts them, blocks the turn, and gives text-only rotation advice.
maintainer: Adrian Tanz
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/AdrianTanz/hermes-secret-remediation
version: "0.1.0"
title: secret-remediation
platforms: []
known_issues:
  - "Blocks the current user message and tool calls. It does not rewrite an earlier transcript row that already contains a credential."
  - "Detects known token prefixes and PEM blocks. Encoded or split values can pass."
  - "The scheduled scan prints only new fingerprints. A clean tick is silent."
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - transform_tool_result
    - transform_terminal_output
    - transform_llm_output
  provides_middleware: []
  requires_env: []
